name: Crawl capability probe

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Source matrix to probe
        required: true
        default: core
        type: choice
        options:
          - core
          - foreign_communities
      repetitions:
        description: Number of observations per source
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"

permissions:
  contents: read

concurrency:
  group: crawl-capability
  cancel-in-progress: false

jobs:
  test-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --disable-pip-version-check -e '.[test]'

      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Run contract tests
        run: python -m pytest --cov=finance_crawler_poc --cov-report=term-missing --cov-fail-under=80

      - name: Select bounded source manifest
        run: |
          case "${{ inputs.scope }}" in
            core) manifest="sources.yaml" ;;
            foreign_communities) manifest="foreign-community-sources.yaml" ;;
            *) echo "unsupported scope" >&2; exit 2 ;;
          esac
          echo "PROBE_MANIFEST=$manifest" >> "$GITHUB_ENV"

      - name: Probe source matrix
        run: >-
          python -m finance_crawler_poc
          --manifest "$PROBE_MANIFEST"
          --output artifacts
          --repeat "${{ inputs.repetitions }}"

      - name: Add report to job summary
        if: always() && hashFiles('artifacts/report.md') != ''
        run: cat artifacts/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload capability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finance-crawler-capability-report-${{ inputs.scope }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
