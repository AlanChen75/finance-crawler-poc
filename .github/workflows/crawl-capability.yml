name: Crawl capability probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crawl-capability
  cancel-in-progress: false

jobs:
  test-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --disable-pip-version-check -e '.[test]'

      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Run contract tests
        run: python -m pytest --cov=finance_crawler_poc --cov-report=term-missing --cov-fail-under=80

      - name: Probe source matrix
        run: python -m finance_crawler_poc --manifest sources.yaml --output artifacts

      - name: Add report to job summary
        if: always() && hashFiles('artifacts/report.md') != ''
        run: cat artifacts/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload capability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finance-crawler-capability-report
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
